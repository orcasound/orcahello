<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <style>
      .t{fill:#33404d;font-size:12px;}
      .m{fill:#6b7885;font-size:11px;}
      .h{fill:#ffffff;font-size:13px;font-weight:600;}
      .card{fill:#ffffff;stroke:#c8d0da;stroke-width:1.5;rx:6;}
      .pain{fill:#c0392b;font-size:10px;}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#6b7885"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="440" fill="#f4f6f9"/>

  <!-- TODAY -->
  <text x="16" y="26" fill="#0b3d5c" font-size="15" font-weight="700">Today: three separate UIs, no shared unit</text>

  <!-- Reports -->
  <rect x="16" y="44" width="200" height="130" class="card"/>
  <rect x="16" y="44" width="200" height="24" fill="#5a6b7a"/>
  <text x="26" y="61" class="h">Reports UI</text>
  <text x="26" y="88" class="m">record-oriented table</text>
  <text x="26" y="106" class="m">ID &#183; node &#183; detections</text>
  <text x="26" y="124" class="m">timestamp &#183; category</text>
  <text x="26" y="150" class="pain">weak for temporal clustering</text>

  <!-- OrcaHello -->
  <rect x="256" y="44" width="200" height="130" class="card"/>
  <rect x="256" y="44" width="200" height="24" fill="#5a6b7a"/>
  <text x="266" y="61" class="h">OrcaHello portal</text>
  <text x="266" y="88" class="m">best queue UX</text>
  <text x="266" y="106" class="m">buckets, filters, audio</text>
  <text x="266" y="124" class="m">avg confidence, spectrogram</text>
  <text x="266" y="150" class="pain">unit = model candidate, not bout</text>

  <!-- Bouts -->
  <rect x="496" y="44" width="200" height="130" class="card"/>
  <rect x="496" y="44" width="200" height="24" fill="#5a6b7a"/>
  <text x="506" y="61" class="h">Bouts UI</text>
  <text x="506" y="88" class="m">publish &amp; discovery</text>
  <text x="506" y="106" class="m">per-node cards, past bouts</text>
  <text x="506" y="124" class="m">+ NEW BOUT entry point</text>
  <text x="506" y="150" class="pain">recursive seek; +15min resets zoom</text>

  <!-- admin -->
  <rect x="736" y="44" width="208" height="130" class="card"/>
  <rect x="736" y="44" width="208" height="24" fill="#5a6b7a"/>
  <text x="746" y="61" class="h">Admin (raw DB)</text>
  <text x="746" y="88" class="m">live.orcasound.net/admin</text>
  <text x="746" y="106" class="m">direct records</text>
  <text x="746" y="124" class="m">not a moderation workflow</text>
  <text x="746" y="150" class="pain">no guardrails</text>

  <text x="16" y="200" class="m">moderator manually re-establishes context across tabs &#8594; slow, error-prone, hard to measure</text>

  <!-- divider -->
  <line x1="16" y1="220" x2="944" y2="220" stroke="#c8d0da" stroke-width="1"/>

  <!-- PROPOSED -->
  <text x="16" y="252" fill="#0b3d5c" font-size="15" font-weight="700">Proposed: one Moderator Workbench &#8212; primary object = candidate bout</text>

  <!-- pipeline -->
  <g>
    <rect x="16" y="272" width="150" height="54" fill="#eef6ff" stroke="#3457d5" stroke-width="1.5" rx="6"/>
    <text x="30" y="296" class="t" font-weight="600">Incoming evidence</text>
    <text x="30" y="314" class="m">human reports + models</text>

    <line x1="166" y1="299" x2="205" y2="299" stroke="#6b7885" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="210" y="272" width="150" height="54" fill="#eef6ff" stroke="#3457d5" stroke-width="1.5" rx="6"/>
    <text x="224" y="296" class="t" font-weight="600">Candidate bout</text>
    <text x="224" y="314" class="m">auto-clustered (3/15 min)</text>

    <line x1="360" y1="299" x2="399" y2="299" stroke="#6b7885" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="404" y="272" width="150" height="54" fill="#eef6ff" stroke="#3457d5" stroke-width="1.5" rx="6"/>
    <text x="418" y="296" class="t" font-weight="600">Boundary review</text>
    <text x="418" y="314" class="m">verify silence, extend</text>

    <line x1="554" y1="299" x2="593" y2="299" stroke="#6b7885" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="598" y="272" width="150" height="54" fill="#eef6ff" stroke="#3457d5" stroke-width="1.5" rx="6"/>
    <text x="612" y="296" class="t" font-weight="600">Classify + tag</text>
    <text x="612" y="314" class="m">type, species, granularity</text>

    <line x1="748" y1="299" x2="787" y2="299" stroke="#6b7885" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="792" y="272" width="152" height="54" fill="#e6f6ec" stroke="#1f8a4c" stroke-width="1.5" rx="6"/>
    <text x="806" y="296" class="t" font-weight="600">Publish + notify</text>
    <text x="806" y="314" class="m">split by audience</text>
  </g>

  <!-- feedback loop -->
  <path d="M660,326 C660,372 240,372 240,326" fill="none" stroke="#8a3ffc" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="360" y="366" fill="#8a3ffc" font-size="11">corrected signal labels &#8594; model retrain (KPI 3)</text>

  <!-- KPI callouts -->
  <text x="16" y="404" class="m">KPI1 time-to-notification &#8595; &#183; KPI2 % moderated &#8593; &#183; KPI3 accuracy &#8593; &#183; KPI4 granularity &#8593; &#183; KPI6c moderators &#8593;</text>
  <text x="16" y="424" class="m">Cross-node "heard at N sites" flag (#584) &#183; dev-mode auth + JSON seed for local onboarding (#620)</text>
</svg>
