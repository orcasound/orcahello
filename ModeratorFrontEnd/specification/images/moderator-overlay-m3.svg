<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="540" viewBox="0 0 1180 540" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <style>
      .panel{fill:#fff;stroke:#c9d3dc;stroke-width:1.5}.navy{fill:#0c4968}.title{fill:#fff;font-size:15px;font-weight:700}.label{fill:#263847;font-size:13px}.small{fill:#607483;font-size:11px}.tiny{fill:#718493;font-size:10px}.axis{stroke:#91a3b1;stroke-width:1}.grid{stroke:#30434f;stroke-width:.7;opacity:.55}.chip{fill:#e8f4f8;stroke:#91bed0}.button{fill:#087c8c}
      .callout{fill:#fff3e0;stroke:#c25a2b;stroke-width:1.2}.calloutText{fill:#8a3c15;font-size:11px;font-weight:600}.leader{stroke:#c25a2b;stroke-width:1.2;stroke-dasharray:3 2;fill:none}.cdot{fill:#c25a2b}
      .ok{fill:#17864b;font-size:11px;font-weight:700}.amber{fill:#b05b22;font-size:11px;font-weight:700}
    </style>
    <linearGradient id="spec" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#09131c"/><stop offset=".55" stop-color="#152d39"/><stop offset="1" stop-color="#081018"/></linearGradient>
    <pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#dfe8ee"/><line x1="0" y1="0" x2="0" y2="6" stroke="#9fb3c0" stroke-width="2"/></pattern>
  </defs>
  <rect width="1180" height="540" fill="#eef3f6"/>
  <rect width="1180" height="44" class="navy"/>
  <text x="18" y="28" class="title" font-size="17">Option M3 · layered canvas — switchable pivot + facet toggles + minimap</text>

  <rect x="20" y="58" width="1140" height="464" rx="6" class="panel"/>

  <!-- control bar -->
  <text x="34" y="86" class="small" font-weight="700">Primary pivot</text>
  <g>
    <circle cx="120" cy="82" r="7" fill="#fff" stroke="#087c8c" stroke-width="2"/><text x="132" y="86" class="small">Reporter</text>
    <circle cx="205" cy="82" r="7" fill="#fff" stroke="#087c8c" stroke-width="2"/><text x="217" y="86" class="small">Species</text>
    <circle cx="290" cy="82" r="7" fill="#087c8c" stroke="#087c8c" stroke-width="2"/><circle cx="290" cy="82" r="3" fill="#fff"/><text x="302" y="86" class="label" font-weight="700">Moderation state</text>
  </g>
  <text x="470" y="86" class="small" font-weight="700">Facets</text>
  <g>
    <rect x="524" y="74" width="14" height="14" rx="2" class="button"/><path d="M527 81l3 3 5-6" stroke="#fff" stroke-width="1.5" fill="none"/><text x="544" y="86" class="small">confirmed</text>
    <rect x="616" y="74" width="14" height="14" rx="2" class="button"/><path d="M619 81l3 3 5-6" stroke="#fff" stroke-width="1.5" fill="none"/><text x="636" y="86" class="small">proposed</text>
    <rect x="702" y="74" width="14" height="14" rx="2" fill="#fff" stroke="#b9c6cf"/><text x="722" y="86" class="small">rejected</text>
    <rect x="790" y="74" width="14" height="14" rx="2" fill="#fff" stroke="#b9c6cf"/><text x="810" y="86" class="small">changed</text>
  </g>

  <!-- minimap ribbon -->
  <rect x="34" y="102" width="1000" height="24" rx="4" fill="#0c1c26"/>
  <g fill="#3f6b7d"><rect x="70" y="108" width="46" height="12"/><rect x="170" y="106" width="70" height="16"/><rect x="320" y="109" width="44" height="10"/><rect x="470" y="105" width="100" height="18"/><rect x="660" y="108" width="60" height="12"/><rect x="840" y="107" width="80" height="14"/></g>
  <path d="M520 98l7 6-7 6-7-6z" fill="#ffcf6b"/>
  <rect x="1044" y="102" width="116" height="24" rx="4" class="chip"/><text x="1052" y="118" class="tiny">minimap · off-screen ✦</text>

  <!-- main canvas rendered by pivot = moderation state -->
  <rect x="34" y="140" width="1000" height="200" rx="3" fill="url(#spec)"/>
  <g class="grid"><line x1="34" y1="190" x2="1034" y2="190"/><line x1="34" y1="240" x2="1034" y2="240"/><line x1="34" y1="290" x2="1034" y2="290"/></g>
  <!-- state lanes -->
  <text x="44" y="176" fill="#bff0d3" font-size="11" font-weight="700">Confirmed 🔒</text>
  <g opacity=".9" fill="#dcf1f8"><rect x="180" y="162" width="4" height="22" rx="1"/><rect x="188" y="166" width="3" height="16" rx="1" fill="#bfe6f4"/><rect x="326" y="162" width="4" height="22" rx="1"/><rect x="496" y="214" width="4" height="22" rx="1"/><rect x="586" y="214" width="4" height="22" rx="1"/><rect x="726" y="214" width="4" height="22" rx="1"/><rect x="846" y="264" width="4" height="22" rx="1"/></g>
  <g fill="none" stroke-width="2"><rect x="150" y="158" width="70" height="30" rx="4" stroke="#39b98f"/><rect x="300" y="158" width="60" height="30" rx="4" stroke="#39b98f"/></g>
  <text x="204" y="178" font-size="11">🔒</text><text x="344" y="178" font-size="11">🔒</text>
  <text x="44" y="228" fill="#cfe0ea" font-size="11" font-weight="700">Proposed</text>
  <g fill="none" stroke="#9fb6c4" stroke-width="2" stroke-dasharray="6 4"><rect x="470" y="210" width="60" height="30" rx="4"/><rect x="560" y="210" width="60" height="30" rx="4"/><rect x="700" y="210" width="60" height="30" rx="4"/></g>
  <text x="44" y="278" fill="#ffd9b8" font-size="11" font-weight="700">Changed</text>
  <rect x="820" y="260" width="60" height="30" rx="4" fill="none" stroke="#df7b2d" stroke-width="2.5"/>
  <g class="tiny" fill="#a9c4d1"><text x="34" y="332">07:55</text><text x="500" y="332">08:05</text><text x="1000" y="332">08:15</text></g>

  <!-- callouts -->
  <path class="leader" d="M290 92 C290 118 360 128 360 128"/><circle cx="290" cy="92" r="3" class="cdot"/>
  <rect x="360" y="360" width="360" height="60" rx="5" class="callout"/>
  <text x="372" y="380" class="calloutText">One control switches the primary pivot —</text>
  <text x="372" y="395" class="calloutText">Reporter | Species | Moderation state — reusing the</text>
  <text x="372" y="410" class="calloutText">§4.0 toggle, extended with a third option.</text>

  <path class="leader" d="M660 88 C660 120 700 128 700 128"/>
  <rect x="34" y="360" width="310" height="60" rx="5" class="callout"/>
  <text x="46" y="380" class="calloutText">Facets hide/show whole classes of signals</text>
  <text x="46" y="395" class="calloutText">(here: rejected + changed are off) so the canvas</text>
  <text x="46" y="410" class="calloutText">stays readable while keeping data underneath.</text>

  <path class="leader" d="M520 110 C520 128 760 128 760 360"/>
  <rect x="736" y="360" width="298" height="60" rx="5" class="callout"/>
  <text x="748" y="380" class="calloutText">Minimap ribbon surfaces changes that are</text>
  <text x="748" y="395" class="calloutText">off-screen (✦), so alerts are discoverable</text>
  <text x="748" y="410" class="calloutText">without scrolling the whole session.</text>

  <rect x="34" y="432" width="1000" height="72" rx="5" fill="#f5f8fa" stroke="#c9d3dc"/>
  <text x="46" y="454" class="label" font-weight="700">Most flexible — highest cost</text>
  <text x="46" y="476" class="small">Supports all three needs (state · species · alerts) and future facets (confidence, call-type) by adding toggles,</text>
  <text x="46" y="496" class="small">not redesigns. Trade-off: complexity and discoverability — needs strong defaults or two moderators see different views.</text>
</svg>
