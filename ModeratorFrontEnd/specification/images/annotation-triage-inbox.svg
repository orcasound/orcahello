<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <style>
      .panel{fill:#fff;stroke:#c9d3dc;stroke-width:1.5}.navy{fill:#0c4968}.title{fill:#fff;font-size:15px;font-weight:700}.heading{fill:#263847;font-size:16px;font-weight:700}.label{fill:#263847;font-size:13px}.small{fill:#607483;font-size:11px}.tiny{fill:#718493;font-size:10px}.button{fill:#087c8c}.green{fill:#17864b}.outline{fill:#fff;stroke:#aebdc9}.selected{fill:#e8f4f8;stroke:#087c8c;stroke-width:2}.callout{fill:#fff3e0;stroke:#c25a2b;stroke-width:1.2}.calloutText{fill:#8a3c15;font-size:11px;font-weight:600}.axis{stroke:#91a3b1;stroke-width:1}.grid{stroke:#30434f;stroke-width:.7;opacity:.55}
    </style>
    <linearGradient id="spec" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#09131c"/><stop offset=".55" stop-color="#183744"/><stop offset="1" stop-color="#081018"/></linearGradient>
  </defs>

  <rect width="1200" height="680" fill="#eef3f6"/>
  <rect width="1200" height="44" class="navy"/>
  <text x="18" y="28" class="title" font-size="17">Option S1 &#183; Time-rail triage inbox (moderator-only)</text>
  <text x="1015" y="27" class="title" font-size="12">Closed bouts &#183; 18 pending</text>

  <rect x="20" y="58" width="1160" height="604" rx="6" class="panel"/>

  <!-- Chronological inbox -->
  <rect x="34" y="72" width="350" height="574" rx="5" fill="#f7fafb" stroke="#c9d3dc"/>
  <text x="50" y="100" class="heading">Unmoderated annotations</text>
  <text x="50" y="120" class="small">Chronological &#183; J/K move &#183; Space listens</text>
  <rect x="50" y="134" width="190" height="28" rx="4" class="outline"/><text x="62" y="152" class="small">All nodes and labels</text><text x="222" y="152" class="small">&#9662;</text>
  <rect x="250" y="134" width="118" height="28" rx="4" class="outline"/><text x="264" y="152" class="small">Oldest first</text><text x="350" y="152" class="small">&#9662;</text>

  <text x="50" y="188" class="small" font-weight="700">TODAY &#183; ORCASOUND LAB</text>
  <rect x="46" y="200" width="326" height="76" rx="5" class="selected"/>
  <rect x="58" y="216" width="16" height="16" rx="3" fill="#087c8c"/><path d="M61 224l3 3 6-8" fill="none" stroke="#fff" stroke-width="1.5"/>
  <text x="84" y="226" class="label" font-weight="700">08:03:19-08:03:22</text>
  <text x="84" y="247" class="small">model 0.94 &#183; transient proposed</text>
  <text x="84" y="266" class="tiny">Bout 08:01-08:17 &#183; selected</text>
  <text x="348" y="226" fill="#087c8c" font-size="12" font-weight="700" text-anchor="end">&#9656;</text>

  <rect x="46" y="284" width="326" height="64" rx="5" fill="#fff" stroke="#d6e0e6"/>
  <rect x="58" y="300" width="16" height="16" rx="3" fill="#fff" stroke="#91a3b1"/>
  <text x="84" y="311" class="label">08:03:26-08:03:29</text>
  <text x="84" y="332" class="small">model 0.88 &#183; unidentified</text>

  <rect x="46" y="356" width="326" height="64" rx="5" fill="#fff" stroke="#d6e0e6"/>
  <rect x="58" y="372" width="16" height="16" rx="3" fill="#fff" stroke="#91a3b1"/>
  <text x="84" y="383" class="label">08:07:04-08:07:07</text>
  <text x="84" y="404" class="small">human &#183; humpback proposed</text>

  <text x="50" y="452" class="small" font-weight="700">YESTERDAY &#183; SUNSET BAY</text>
  <rect x="46" y="464" width="326" height="64" rx="5" fill="#fff" stroke="#d6e0e6"/>
  <rect x="58" y="480" width="16" height="16" rx="3" fill="#fff" stroke="#91a3b1"/>
  <text x="84" y="491" class="label">18:16:11-18:16:14</text>
  <text x="84" y="512" class="small">model 0.91 &#183; orca proposed</text>

  <rect x="46" y="536" width="326" height="64" rx="5" fill="#fff" stroke="#d6e0e6"/>
  <rect x="58" y="552" width="16" height="16" rx="3" fill="#fff" stroke="#91a3b1"/>
  <text x="84" y="563" class="label">18:16:18-18:16:21</text>
  <text x="84" y="584" class="small">model 0.84 &#183; orca proposed</text>

  <text x="50" y="626" class="tiny">Shift selects a range &#183; Enter opens details</text>

  <!-- Detail pane -->
  <text x="410" y="92" class="heading">Selected annotation</text>
  <text x="410" y="115" class="small">Orcasound Lab &#183; closed bout 08:01-08:17 &#183; 08:03:19-08:03:22</text>
  <text x="1032" y="92" class="tiny">1 of 18</text>
  <rect x="1080" y="76" width="38" height="26" rx="4" class="outline"/><text x="1099" y="94" class="label" text-anchor="middle">J</text>
  <rect x="1126" y="76" width="38" height="26" rx="4" class="outline"/><text x="1145" y="94" class="label" text-anchor="middle">K</text>

  <!-- Context and boundary controls -->
  <text x="410" y="146" class="small" font-weight="700">Context</text>
  <rect x="462" y="130" width="46" height="24" rx="4" fill="#fff" stroke="#aebdc9"/><text x="485" y="146" class="small" text-anchor="middle">10 s</text>
  <rect x="514" y="130" width="50" height="24" rx="4" class="button"/><text x="539" y="146" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">2 min</text>
  <rect x="570" y="130" width="54" height="24" rx="4" fill="#fff" stroke="#aebdc9"/><text x="597" y="146" class="small" text-anchor="middle">15 min</text>
  <rect x="630" y="130" width="42" height="24" rx="4" fill="#fff" stroke="#aebdc9"/><text x="651" y="146" class="small" text-anchor="middle">1 h</text>
  <text x="690" y="146" class="tiny">30 s before + full parent minute + 30 s after</text>
  <rect x="940" y="130" width="104" height="24" rx="4" class="outline"/><text x="992" y="146" class="tiny" text-anchor="middle">Fit start boundary</text>
  <rect x="1052" y="130" width="104" height="24" rx="4" class="outline"/><text x="1104" y="146" class="tiny" text-anchor="middle">Fit end boundary</text>

  <!-- Spectrogram -->
  <rect x="410" y="168" width="746" height="190" rx="3" fill="url(#spec)"/>
  <g class="grid"><line x1="410" y1="218" x2="1156" y2="218"/><line x1="410" y1="268" x2="1156" y2="268"/><line x1="410" y1="318" x2="1156" y2="318"/></g>
  <g opacity=".9" fill="#dcf1f8"><rect x="478" y="198" width="6" height="132" rx="2"/><rect x="486" y="218" width="4" height="102" rx="2"/><rect x="656" y="190" width="7" height="142" rx="2"/><rect x="666" y="212" width="4" height="108" rx="2"/><rect x="818" y="204" width="6" height="122" rx="2"/><rect x="1002" y="214" width="5" height="104" rx="2"/></g>
  <rect x="454" y="186" width="58" height="156" rx="4" fill="none" stroke="#39b98f" stroke-width="2.5"/><text x="461" y="202" fill="#fff" font-size="11">&#10003;</text>
  <rect x="630" y="180" width="66" height="164" rx="4" fill="none" stroke="#7f8ff0" stroke-width="2.5" stroke-dasharray="6 4"/><text x="637" y="196" fill="#fff" font-size="11">&#9633;</text>
  <rect x="620" y="172" width="86" height="180" rx="7" fill="none" stroke="#087c8c" stroke-width="2.5" stroke-dasharray="5 3"/>
  <rect x="792" y="194" width="58" height="140" rx="4" fill="none" stroke="#d3a24a" stroke-width="2" stroke-dasharray="1 4"/><text x="799" y="210" fill="#fff" font-size="11">?</text>
  <rect x="976" y="204" width="58" height="124" rx="4" fill="none" stroke="#7f8ff0" stroke-width="2.5" stroke-dasharray="6 4"/><text x="983" y="220" fill="#fff" font-size="11">&#9633;</text>
  <g class="tiny" fill="#a9c4d1"><text x="410" y="352">08:02:30</text><text x="580" y="352">08:03:00</text><text x="762" y="352">08:03:30</text><text x="944" y="352">08:04:00</text><text x="1102" y="352">08:04:30</text></g>

  <!-- Playback and annotation details -->
  <rect x="410" y="374" width="746" height="78" rx="5" fill="#f5f8fa" stroke="#c9d3dc"/>
  <circle cx="440" cy="413" r="20" class="button"/><path d="M434 402l17 11-17 11z" fill="#fff"/>
  <text x="474" y="402" class="label" font-weight="700">Listen to selected annotation</text>
  <text x="474" y="423" class="small">3 seconds &#183; audio remains synchronized with the 2-minute context</text>
  <text x="474" y="442" class="tiny">Source: model v2.3 &#183; confidence 0.94 &#183; state: unmoderated</text>
  <rect x="964" y="392" width="176" height="40" rx="5" class="callout"/>
  <text x="1052" y="408" class="calloutText" text-anchor="middle">List drives throughput;</text>
  <text x="1052" y="423" class="calloutText" text-anchor="middle">detail keeps local context.</text>

  <!-- Tag editor and actions -->
  <rect x="410" y="468" width="746" height="110" rx="5" class="panel"/>
  <text x="426" y="492" class="label" font-weight="700">Annotation label</text>
  <rect x="426" y="504" width="254" height="32" rx="4" class="outline"/><text x="440" y="525" class="label">transient (Biggs)</text><text x="660" y="525" class="small">&#9662;</text>
  <rect x="696" y="504" width="126" height="32" rx="4" class="green"/><text x="759" y="525" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">Confirm tags</text>
  <rect x="834" y="504" width="138" height="32" rx="4" class="button"/><text x="903" y="525" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">Change labels</text>
  <rect x="984" y="504" width="156" height="32" rx="4" class="outline"/><text x="1062" y="525" class="small" text-anchor="middle">Needs confirmation</text>
  <text x="426" y="558" class="small">Confirm advances to the next unmoderated annotation; label changes preview affected bout boundaries before Save.</text>

  <!-- Batch footer -->
  <rect x="410" y="594" width="746" height="42" rx="5" fill="#e8f4f8" stroke="#91bed0"/>
  <text x="426" y="619" class="small" font-weight="700">3 selected in queue</text>
  <text x="552" y="619" class="small">Shift+Enter confirms selection</text>
  <text x="820" y="619" class="tiny">Confirmed items require an audited revision and are never silently skipped.</text>
</svg>