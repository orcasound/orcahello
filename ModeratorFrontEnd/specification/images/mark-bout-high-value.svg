<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <style>
      .panel{fill:#fff;stroke:#c9d3dc;stroke-width:1.5}.navy{fill:#0c4968}.title{fill:#fff;font-size:15px;font-weight:700}.label{fill:#263847;font-size:13px}.small{fill:#607483;font-size:11px}.tiny{fill:#718493;font-size:10px}.outline{fill:#fff;stroke:#aebdc9}.chip{fill:#e8f4f8;stroke:#91bed0}.button{fill:#087c8c}.gold{fill:#fff5d6;stroke:#c88b16;stroke-width:2}.goldText{fill:#8a5b00;font-size:12px;font-weight:700}.callout{fill:#fff3e0;stroke:#c25a2b;stroke-width:1.2}.calloutText{fill:#8a3c15;font-size:11px;font-weight:600}.leader{stroke:#c25a2b;stroke-width:1.2;stroke-dasharray:3 2;fill:none}
    </style>
    <linearGradient id="spec" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#09131c"/><stop offset=".55" stop-color="#183744"/><stop offset="1" stop-color="#081018"/></linearGradient>
  </defs>
  <rect width="1200" height="700" fill="#eef3f6"/><rect width="1200" height="44" class="navy"/>
  <text x="18" y="28" class="title" font-size="17">Moderator Workbench &#183; Edit existing bout</text>
  <text x="990" y="27" class="title" font-size="12">Sunset Bay &#183; Today 09:42</text>

  <rect x="20" y="60" width="820" height="620" rx="6" class="panel"/>
