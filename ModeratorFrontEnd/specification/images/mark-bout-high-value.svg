  <g stroke="#30434f" stroke-width=".7" opacity=".55"><line x1="38" y1="202" x2="822" y2="202"/><line x1="38" y1="264" x2="822" y2="264"/><line x1="38" y1="326" x2="822" y2="326"/></g>
  <g fill="#d8f2fb"><rect x="104" y="182" width="7" height="154"/><rect x="158" y="210" width="5" height="114"/><rect x="226" y="174" width="8" height="170"/><rect x="316" y="198" width="6" height="130"/><rect x="418" y="166" width="8" height="180"/><rect x="536" y="205" width="6" height="122"/><rect x="648" y="180" width="7" height="158"/><rect x="750" y="214" width="5" height="108"/></g>
  <g fill="none" stroke="#1d9a75" stroke-width="2"><rect x="86" y="166" width="44" height="184" rx="4"/><rect x="140" y="194" width="42" height="144" rx="4"/><rect x="206" y="158" width="48" height="200" rx="4"/><rect x="296" y="182" width="46" height="160" rx="4"/><rect x="396" y="150" width="52" height="210" rx="4"/><rect x="514" y="188" width="48" height="154" rx="4"/><rect x="626" y="164" width="50" height="188" rx="4"/><rect x="730" y="198" width="46" height="140" rx="4"/></g>
  <text x="42" y="408" class="tiny">09:38</text><text x="230" y="408" class="tiny">09:40</text><text x="422" y="408" class="tiny">09:42</text><text x="614" y="408" class="tiny">09:44</text><text x="784" y="408" class="tiny">09:46</text>
  <circle cx="64" cy="450" r="18" class="button"/><path d="M59 441l14 9-14 9z" fill="#fff"/>
  <text x="94" y="447" class="label">Play confirmed annotations</text><text x="94" y="466" class="small">Clear calls &#183; low vessel noise &#183; audio synchronized</text>
  <rect x="38" y="494" width="784" height="76" rx="5" fill="#f5f8fa" stroke="#c9d3dc"/>
  <text x="54" y="518" class="label" font-weight="700">Review history</text>
  <text x="54" y="540" class="small">09:48 &#183; Kai confirmed boundaries and tags</text>
  <text x="54" y="558" class="small">09:51 &#183; High Value added &#183; quality note saved</text>
  <text x="38" y="618" class="small">Changes remain pending until Save bout changes. Saving does not publish or notify.</text>

  <rect x="856" y="60" width="324" height="620" rx="6" class="panel"/>
  <rect x="856" y="60" width="324" height="36" rx="6" class="navy"/>
  <text x="872" y="84" class="title">Bout details</text>
  <text x="876" y="126" class="small">Title</text><rect x="876" y="136" width="284" height="34" rx="4" class="outline"/><text x="888" y="158" class="label">Southern Residents calling</text>
  <text x="876" y="202" class="small">Tags</text>
  <rect x="876" y="212" width="48" height="24" rx="12" class="chip"/><text x="888" y="228" class="small">srkw</text>
  <rect x="932" y="212" width="54" height="24" rx="12" class="chip"/><text x="944" y="228" class="small">J-pod</text>
  <rect x="994" y="212" width="42" height="24" rx="12" class="chip"/><text x="1006" y="228" class="small">S04</text>

  <rect x="876" y="266" width="284" height="54" rx="5" class="gold"/>
  <text x="894" y="299" fill="#c88b16" font-size="24">&#9733;</text>
  <text x="930" y="289" class="goldText">High Value</text>
  <text x="930" y="307" class="small">Included in quality examples</text>
  <rect x="1114" y="282" width="30" height="18" rx="9" fill="#17864b"/><circle cx="1135" cy="291" r="7" fill="#fff"/>

  <text x="876" y="350" class="small">Why is this example valuable? (optional)</text>
  <rect x="876" y="360" width="284" height="78" rx="4" class="outline"/>
  <text x="888" y="384" class="label">Clear calls with low vessel noise;</text>
  <text x="888" y="404" class="label">representative S04 sequence.</text>
  <text x="888" y="426" class="tiny">Shown in Recent bouts; does not affect rank.</text>
  <rect x="876" y="470" width="284" height="38" rx="5" class="button"/><text x="1018" y="494" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">Save bout changes</text>
  <text x="876" y="536" class="small">Moderator-only action</text>
  <text x="876" y="555" class="tiny">Adds canonical tag: high-value</text>
  <text x="876" y="574" class="tiny">Writes who / when / from / to to history</text>

  <path class="leader" d="M876 292 C826 292 826 250 806 250"/>
  <rect x="518" y="594" width="642" height="58" rx="5" class="callout"/>
  <text x="532" y="616" class="calloutText">The star is available while creating or updating a bout. Turning it on adds</text>
  <text x="532" y="634" class="calloutText">the high-value tag and audit entry; it never changes publish or notification state.</text>
</svg>