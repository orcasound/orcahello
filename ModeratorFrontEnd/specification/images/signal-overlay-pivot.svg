<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <style>
      .panel{fill:#fff;stroke:#c9d3dc;stroke-width:1.5}.navy{fill:#0c4968}.title{fill:#fff;font-size:15px;font-weight:700}.label{fill:#263847;font-size:13px}.small{fill:#607483;font-size:11px}.tiny{fill:#718493;font-size:10px}.chip{fill:#e8f4f8;stroke:#91bed0}.a{fill:#1d9a75}.b{fill:#df7b2d}.axis{stroke:#91a3b1;stroke-width:1}.grid{stroke:#30434f;stroke-width:.7;opacity:.55}
      .callout{fill:#fff3e0;stroke:#c25a2b;stroke-width:1.2}.calloutText{fill:#8a3c15;font-size:11px;font-weight:600}.leader{stroke:#c25a2b;stroke-width:1.2;stroke-dasharray:3 2;fill:none}.cdot{fill:#c25a2b}
      .ok{fill:#17864b;font-size:11px;font-weight:700}.amber{fill:#b05b22;font-size:11px;font-weight:700}
    </style>
    <linearGradient id="spec" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#09131c"/><stop offset=".55" stop-color="#152d39"/><stop offset="1" stop-color="#081018"/></linearGradient>
  </defs>
  <rect width="1180" height="560" fill="#eef3f6"/>
  <rect width="1180" height="44" class="navy"/>
  <text x="18" y="28" class="title" font-size="17">Main overlay · one-tap pivot — “Who reported” ⇄ “What is here”</text>

  <!-- toggle control -->
  <rect x="430" y="60" width="320" height="34" rx="17" class="chip"/>
  <rect x="433" y="63" width="156" height="28" rx="14" fill="#087c8c"/>
  <text x="512" y="82" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">Who reported</text>
  <text x="668" y="82" fill="#0c4968" font-size="12" font-weight="700" text-anchor="middle">What is here</text>
  <text x="612" y="82" font-size="14" fill="#0c4968" text-anchor="middle">⇄</text>
  <rect x="770" y="60" width="360" height="34" rx="6" class="callout"/>
  <text x="784" y="81" class="calloutText">One tap re-labels lanes in place · zoom, playback &amp; selection kept</text>

  <!-- LEFT PANEL: who reported -->
  <rect x="20" y="120" width="548" height="404" rx="6" class="panel"/>
  <rect x="20" y="120" width="548" height="30" rx="6" class="navy"/>
  <text x="34" y="141" class="title">Pivot A · Who reported (per-reporter lanes)</text>
  <rect x="40" y="176" width="500" height="120" rx="3" fill="url(#spec)"/>
  <g class="grid"><line x1="40" y1="216" x2="540" y2="216"/><line x1="40" y1="256" x2="540" y2="256"/></g>
  <g opacity=".9"><rect x="99" y="196" width="5" height="86" rx="2" fill="#dcf1f8"/><rect x="107" y="210" width="3" height="66" rx="2" fill="#bfe6f4"/><rect x="152" y="222" width="5" height="58" rx="2" fill="#dcf1f8"/><rect x="253" y="188" width="5" height="98" rx="2" fill="#dcf1f8"/><rect x="261" y="206" width="3" height="74" rx="2" fill="#bfe6f4"/><rect x="322" y="210" width="5" height="72" rx="2" fill="#dcf1f8"/><rect x="413" y="204" width="5" height="76" rx="2" fill="#dcf1f8"/><rect x="472" y="224" width="5" height="56" rx="2" fill="#dcf1f8"/></g>
  <g fill="none" stroke-width="2"><rect x="90" y="188" width="26" height="102" rx="2" stroke="#39b98f"/><rect x="246" y="184" width="26" height="106" rx="2" stroke="#39b98f"/><rect x="404" y="198" width="24" height="90" rx="2" stroke="#39b98f"/><rect x="144" y="214" width="24" height="74" rx="2" stroke="#7f8ff0" stroke-dasharray="5 3"/><rect x="314" y="202" width="24" height="86" rx="2" stroke="#7f8ff0" stroke-dasharray="5 3"/><rect x="464" y="216" width="24" height="72" rx="2" stroke="#b0873a" stroke-dasharray="5 3"/></g>
  <g fill="#fff" font-size="11" font-weight="700"><text x="94" y="201">✓</text><text x="250" y="197">□</text><text x="408" y="211">?</text><text x="148" y="227">□</text><text x="318" y="215">✓</text><text x="468" y="229">×</text></g>
  <g stroke="#61a9ff" stroke-width="1" stroke-dasharray="2 4" opacity=".4"><line x1="103" y1="296" x2="103" y2="342"/><line x1="259" y1="296" x2="259" y2="342"/><line x1="416" y1="296" x2="416" y2="342"/><line x1="156" y1="296" x2="156" y2="384"/><line x1="326" y1="296" x2="326" y2="384"/><line x1="476" y1="296" x2="476" y2="384"/></g>
  <!-- reporter lanes -->
  <text x="40" y="312" class="small">Human · solid</text>
  <rect x="120" y="318" width="420" height="24" rx="3" fill="#e8f7f2"/><line x1="120" y1="330" x2="540" y2="330" class="axis"/>
  <rect x="95" y="322" width="16" height="16" fill="none" stroke="#39b98f" stroke-width="2"/><text x="98" y="335" class="ok">✓</text>
  <rect x="251" y="322" width="16" height="16" fill="none" stroke="#39b98f" stroke-width="2"/><text x="254" y="335" class="small">□</text>
  <rect x="408" y="322" width="16" height="16" fill="none" stroke="#39b98f" stroke-width="2"/><text x="412" y="335" class="amber">?</text>
  <text x="40" y="354" class="small">Model · dashed</text>
  <rect x="120" y="360" width="420" height="24" rx="3" fill="#fff1e6"/><line x1="120" y1="372" x2="540" y2="372" class="axis"/>
  <rect x="149" y="365" width="14" height="14" rx="2" fill="none" stroke="#7f8ff0" stroke-width="2" stroke-dasharray="4 2"/><text x="151" y="377" class="tiny">□</text><rect x="319" y="365" width="14" height="14" rx="2" fill="none" stroke="#7f8ff0" stroke-width="2" stroke-dasharray="4 2"/><text x="321" y="377" class="tiny">✓</text><rect x="469" y="365" width="14" height="14" rx="2" fill="none" stroke="#b0873a" stroke-width="2" stroke-dasharray="4 2"/><text x="471" y="377" class="tiny">×</text>
  <text x="40" y="420" class="tiny">Best for provenance &amp; comparing reporters (today’s default)</text>
  <rect x="40" y="436" width="230" height="70" rx="5" fill="#f5f8fa" stroke="#c9d3dc"/>
  <text x="52" y="456" class="small" font-weight="700">Same markers in either pivot</text>
  <text x="52" y="478" class="small">Color = type · outline = source</text>
  <text x="52" y="498" class="small">Corner: □ / ✓ / × / ? = moderation</text>

  <!-- RIGHT PANEL: what is here -->
  <rect x="612" y="120" width="548" height="404" rx="6" class="panel"/>
  <rect x="612" y="120" width="548" height="30" rx="6" class="navy"/>
  <text x="626" y="141" class="title">Pivot B · What is here (species swimlanes)</text>
  <rect x="632" y="176" width="500" height="120" rx="3" fill="url(#spec)"/>
  <g class="grid"><line x1="632" y1="216" x2="1132" y2="216"/><line x1="632" y1="256" x2="1132" y2="256"/></g>
  <g opacity=".9"><rect x="691" y="196" width="5" height="86" rx="2" fill="#dcf1f8"/><rect x="699" y="210" width="3" height="66" rx="2" fill="#bfe6f4"/><rect x="746" y="220" width="5" height="58" rx="2" fill="#dcf1f8"/><rect x="846" y="188" width="5" height="98" rx="2" fill="#dcf1f8"/><rect x="854" y="206" width="3" height="74" rx="2" fill="#bfe6f4"/><rect x="916" y="210" width="5" height="72" rx="2" fill="#dcf1f8"/><rect x="1006" y="204" width="5" height="76" rx="2" fill="#dcf1f8"/></g>
  <g fill="none" stroke-width="2"><rect x="682" y="188" width="26" height="100" rx="2" stroke="#39b98f"/><rect x="837" y="184" width="26" height="106" rx="2" stroke="#39b98f"/><rect x="997" y="198" width="24" height="88" rx="2" stroke="#39b98f"/><rect x="736" y="212" width="24" height="74" rx="2" stroke="#7f8ff0" stroke-dasharray="5 3"/><rect x="906" y="202" width="24" height="86" rx="2" stroke="#b0873a" stroke-dasharray="1 3"/></g>
  <g fill="#fff" font-size="11" font-weight="700"><text x="686" y="201">✓</text><text x="841" y="197">□</text><text x="1001" y="211">?</text><text x="740" y="225">□</text><text x="910" y="215">×</text></g>
  <g stroke="#61a9ff" stroke-width="1" stroke-dasharray="2 4" opacity=".4"><line x1="695" y1="296" x2="695" y2="342"/><line x1="850" y1="296" x2="850" y2="342"/><line x1="1009" y1="296" x2="1009" y2="342"/><line x1="748" y1="296" x2="748" y2="384"/><line x1="918" y1="296" x2="918" y2="424"/></g>
  <!-- species lanes -->
  <text x="632" y="330" class="small">Humpback</text>
  <rect x="712" y="318" width="420" height="24" rx="3" fill="#eaf5ef"/><line x1="712" y1="330" x2="1132" y2="330" class="axis"/>
  <rect x="687" y="322" width="16" height="16" fill="none" stroke="#39b98f" stroke-width="2"/><text x="690" y="335" class="ok">✓</text>
  <rect x="842" y="322" width="16" height="16" fill="none" stroke="#39b98f" stroke-width="2"/><text x="845" y="335" class="small">□</text>
  <rect x="1001" y="322" width="16" height="16" fill="none" stroke="#39b98f" stroke-width="2"/><text x="1005" y="335" class="amber">?</text>
  <text x="632" y="372" class="small">Transient</text>
  <rect x="712" y="360" width="420" height="24" rx="3" fill="#eef0fb"/><line x1="712" y1="372" x2="1132" y2="372" class="axis"/>
  <rect x="741" y="365" width="14" height="14" rx="2" fill="none" stroke="#7f8ff0" stroke-width="2" stroke-dasharray="4 2"/><text x="743" y="377" class="tiny">□</text>
  <text x="632" y="414" class="small">Unassigned</text>
  <rect x="712" y="402" width="420" height="22" rx="3" fill="#f3f5f7"/><line x1="712" y1="413" x2="1132" y2="413" class="axis"/>
  <rect x="911" y="406" width="14" height="14" rx="2" fill="none" stroke="#b0873a" stroke-width="2" stroke-dasharray="1 3"/><text x="913" y="418" class="tiny">×</text>
  <text x="632" y="452" class="tiny">Best for mixed-species overlap &amp; two bouts sharing one timeframe</text>

  <!-- callouts linking -->
  <path class="leader" d="M103 344 C103 400 300 470 300 470"/><circle cx="103" cy="344" r="3" class="cdot"/>
  <path class="leader" d="M695 344 C695 470 560 500 560 500"/><circle cx="695" cy="344" r="3" class="cdot"/>
  <rect x="300" y="470" width="270" height="40" rx="5" class="callout"/>
  <text x="312" y="486" class="calloutText">Same annotation, re-grouped by the toggle —</text>
  <text x="312" y="501" class="calloutText">color, outline pattern, and corner glyph stay unchanged</text>

  <path class="leader" d="M632 405 C600 405 585 452 612 452"/>
  <rect x="626" y="470" width="300" height="40" rx="5" class="callout"/>
  <text x="638" y="486" class="calloutText">“Unassigned” lane holds ambiguous minutes</text>
  <text x="638" y="501" class="calloutText">until species is assigned (bout-spec Appendix A · A)</text>
</svg>
