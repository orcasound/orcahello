<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="500" viewBox="0 0 1080 500" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <style>
      .panel{fill:#fff;stroke:#c9d3dc;stroke-width:1.5}.navy{fill:#0c4968}.title{fill:#fff;font-size:15px;font-weight:700}.label{fill:#263847;font-size:13px}.small{fill:#607483;font-size:11px}.tiny{fill:#718493;font-size:10px}.axis{stroke:#91a3b1;stroke-width:1}.hump{fill:#2f8f77}.trans{fill:#5b6bd6}.ok{fill:#17864b;font-size:11px;font-weight:700}
      .callout{fill:#fff3e0;stroke:#c25a2b;stroke-width:1.2}.calloutText{fill:#8a3c15;font-size:11px;font-weight:600}.leader{stroke:#c25a2b;stroke-width:1.2;stroke-dasharray:3 2;fill:none}.cdot{fill:#c25a2b}.diverge{stroke:#b45539;stroke-width:2}
    </style>
    <linearGradient id="spec" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#09131c"/><stop offset=".55" stop-color="#152d39"/><stop offset="1" stop-color="#081018"/></linearGradient>
  </defs>
  <rect width="1080" height="500" fill="#eef3f6"/>
  <rect width="1080" height="44" class="navy"/>
  <text x="18" y="28" class="title" font-size="17">Option R2 · my contribution vs consensus (split overlay)</text>

  <rect x="20" y="58" width="1040" height="424" rx="6" class="panel"/>
  <text x="34" y="86" class="small">Two aligned bands on one time axis. Divergences between your tags and the confirmed consensus are highlighted.</text>

  <!-- shared spectrogram -->
  <rect x="120" y="98" width="820" height="80" rx="3" fill="url(#spec)"/>
  <g opacity=".8"><rect x="200" y="110" width="12" height="56" rx="2" fill="#2f8f77"/><rect x="430" y="112" width="12" height="54" rx="2" fill="#5b6bd6"/><rect x="520" y="108" width="12" height="60" rx="2" fill="#5b6bd6"/><rect x="720" y="116" width="12" height="46" rx="2" fill="#9fb3c0"/></g>
  <g class="tiny" fill="#a9c4d1"><text x="120" y="192">08:00</text><text x="520" y="192">08:05</text><text x="905" y="192">08:10</text></g>

  <!-- YOU band -->
  <text x="34" y="238" class="label" font-weight="700">You</text>
  <text x="34" y="256" class="tiny">(this reporter)</text>
  <rect x="120" y="222" width="820" height="44" rx="5" fill="#eef0fb"/><line x1="120" y1="244" x2="940" y2="244" class="axis"/>
  <g><rect x="180" y="230" width="96" height="28" rx="14" fill="#fff" stroke="#5b6bd6"/><circle cx="196" cy="244" r="6" class="hump"/><text x="208" y="248" class="small">humpback</text></g>
  <g><rect x="480" y="230" width="96" height="28" rx="14" fill="#fff" stroke="#5b6bd6"/><circle cx="496" cy="244" r="6" class="hump"/><text x="508" y="248" class="small">humpback</text></g>

  <!-- CONSENSUS band -->
  <text x="34" y="330" class="label" font-weight="700">Confirmed</text>
  <text x="34" y="348" class="tiny">consensus 🔒</text>
  <rect x="120" y="314" width="820" height="44" rx="5" fill="#eaf5ef"/><line x1="120" y1="336" x2="940" y2="336" class="axis"/>
  <g><rect x="180" y="322" width="110" height="28" rx="14" fill="#dff0e6" stroke="#17864b"/><circle cx="196" cy="336" r="6" class="hump"/><text x="208" y="340" class="small">humpback</text><text x="266" y="341" font-size="12">🔒</text></g>
  <g><rect x="480" y="322" width="108" height="28" rx="14" fill="#dff0e6" stroke="#17864b"/><circle cx="496" cy="336" r="6" class="trans"/><text x="508" y="340" class="small">transient</text><text x="562" y="341" font-size="12">🔒</text></g>

  <!-- agreement link -->
  <line x1="228" y1="258" x2="228" y2="322" stroke="#17864b" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="234" y="292" class="ok">agree</text>

  <!-- divergence link -->
  <line x1="528" y1="258" x2="528" y2="322" class="diverge"/>
  <circle cx="528" cy="290" r="12" fill="#fff" stroke="#b45539" stroke-width="2"/><text x="528" y="294" fill="#b45539" font-size="12" font-weight="700" text-anchor="middle">!</text>

  <!-- callouts -->
  <path class="leader" d="M540 290 C640 290 700 300 700 300"/><circle cx="540" cy="290" r="3" class="cdot"/>
  <rect x="690" y="278" width="340" height="46" rx="5" class="callout"/>
  <text x="702" y="296" class="calloutText">Divergence highlighted: you tagged humpback;</text>
  <text x="702" y="311" class="calloutText">a moderator confirmed transient — a feedback moment.</text>

  <rect x="120" y="388" width="910" height="82" rx="6" fill="#f5f8fa" stroke="#c9d3dc"/>
  <text x="132" y="410" class="label" font-weight="700">Why it helps</text>
  <text x="132" y="432" class="small">• Strong feedback loop — reporters see where they agreed with and diverged from moderator decisions.</text>
  <text x="132" y="452" class="small">• Surfaces disagreements as clean signal for people and models. Confirmed row stays authoritative &amp; locked.</text>
  <text x="132" y="468" class="tiny">Tone/privacy: don’t expose moderator identity by default; frame as learning, not grading.</text>
</svg>
