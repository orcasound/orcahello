<svg xmlns="http://www.w3.org/2000/svg" width="390" height="720" viewBox="0 0 390 720" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <style>
      .label{fill:#263847;font-size:13px}.small{fill:#617583;font-size:11px}.tiny{fill:#728694;font-size:10px}.white{fill:#fff;font-size:13px;font-weight:700}.panel{fill:#fff;stroke:#c8d3dc}.hump{fill:#2f8f77}.trans{fill:#5b6bd6}.vessel{fill:#b0873a}.button{fill:#087c8c}.ok{fill:#17864b;font-size:11px;font-weight:700}
      .callout{fill:#fff3e0;stroke:#c25a2b;stroke-width:1.2}.calloutText{fill:#8a3c15;font-size:10px;font-weight:600}.leader{stroke:#c25a2b;stroke-width:1.2;stroke-dasharray:3 2;fill:none}.cdot{fill:#c25a2b}.sel{stroke:#087c8c;stroke-width:2.5;fill:none}
    </style>
    <linearGradient id="mspec" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#09131c"/><stop offset=".55" stop-color="#15313c"/><stop offset="1" stop-color="#081018"/></linearGradient>
  </defs>
  <rect width="390" height="720" fill="#eef3f6"/>
  <rect width="390" height="48" fill="#0c4968"/>
  <text x="16" y="30" class="white" font-size="15">Reporter · guided chips (mobile)</text>

  <rect x="12" y="60" width="366" height="72" rx="6" class="panel"/>
  <text x="24" y="82" class="label" font-weight="700">Orcasound Lab · 08:03</text>
  <text x="24" y="102" class="small">Tap a chip to tag · long-press to multi-select</text>
  <text x="24" y="120" class="tiny">Species by color · status by chip</text>

  <!-- mini spectrogram -->
  <rect x="12" y="144" width="366" height="96" rx="6" class="panel"/>
  <rect x="20" y="152" width="350" height="80" rx="3" fill="url(#mspec)"/>
  <g opacity=".9" fill="#dcf1f8"><rect x="73" y="170" width="4" height="48" rx="1"/><rect x="153" y="176" width="4" height="42" rx="1"/><rect x="223" y="172" width="4" height="46" rx="1"/><rect x="303" y="184" width="4" height="34" rx="1"/></g>
  <g fill="none" stroke-width="2"><rect x="64" y="162" width="22" height="60" rx="2" stroke="#39b98f"/><rect x="144" y="168" width="22" height="54" rx="2" stroke="#7f8ff0"/><rect x="214" y="164" width="22" height="58" rx="2" stroke="#7f8ff0"/><rect x="294" y="178" width="22" height="42" rx="2" stroke="#d3a24a" stroke-dasharray="5 3"/></g>

  <!-- chip list (single lane, vertical for phone) -->
  <text x="16" y="266" class="label" font-weight="700">Signals</text>
  <!-- confirmed authoritative -->
  <rect x="12" y="278" width="366" height="40" rx="8" fill="#dff0e6" stroke="#17864b"/>
  <circle cx="34" cy="298" r="8" class="hump"/><text x="50" y="302" class="label">humpback</text><text x="150" y="303" class="ok">confirmed</text><text x="340" y="304" class="ok">✓</text>
  <!-- pending untagged -->
  <rect x="12" y="326" width="366" height="40" rx="8" fill="#fff" stroke="#b9c6cf" stroke-dasharray="4 3"/>
  <circle cx="34" cy="346" r="8" fill="#b9c6cf"/><text x="50" y="350" class="label">untagged</text><text x="150" y="351" class="small">pending · tap to tag</text>
  <!-- selected group (2 transient) -->
  <rect x="12" y="374" width="366" height="40" rx="8" fill="#eef0fb" stroke="#5b6bd6"/>
  <rect x="24" y="386" width="16" height="16" rx="3" class="button"/><path d="M27 394l4 4 6-7" stroke="#fff" stroke-width="1.8" fill="none"/>
  <circle cx="60" cy="394" r="8" class="trans"/><text x="76" y="398" class="label">transient?</text><text x="170" y="399" class="small">changed · re-tag</text>
  <rect x="12" y="422" width="366" height="40" rx="8" fill="#eef0fb" stroke="#5b6bd6"/>
  <rect x="24" y="434" width="16" height="16" rx="3" class="button"/><path d="M27 442l4 4 6-7" stroke="#fff" stroke-width="1.8" fill="none"/>
  <circle cx="60" cy="442" r="8" class="trans"/><text x="76" y="446" class="label">transient?</text><text x="170" y="447" class="small">pending</text>
  <rect x="8" y="372" width="374" height="94" rx="10" class="sel" stroke-dasharray="6 4"/>

  <!-- tag sheet -->
  <rect x="12" y="480" width="366" height="96" rx="8" fill="#fff" stroke="#087c8c" stroke-width="1.5"/>
  <rect x="12" y="480" width="366" height="28" rx="8" fill="#087c8c"/><text x="26" y="499" fill="#fff" font-size="12" font-weight="700">Tag 2 selected</text>
  <rect x="26" y="518" width="338" height="26" rx="4" fill="#f2f6f8" stroke="#c8d3dc"/><text x="38" y="535" class="label">transient (Biggs) ▾</text>
  <rect x="26" y="550" width="150" height="20" rx="4" class="button"/><text x="101" y="565" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">Apply to 2</text>

  <!-- callouts -->
  <path class="leader" d="M340 298 C360 280 360 262 360 262"/>
  <rect x="150" y="600" width="228" height="40" rx="6" class="callout"/>
  <text x="162" y="617" class="calloutText">Confirmed = authoritative ✓.</text>
  <text x="162" y="630" class="calloutText">New input stays a proposal.</text>

  <rect x="12" y="600" width="130" height="40" rx="6" class="callout"/>
  <text x="24" y="617" class="calloutText">Long-press to</text>
  <text x="24" y="630" class="calloutText">group-select.</text>

  <rect x="12" y="650" width="366" height="56" rx="6" class="panel"/>
  <text x="24" y="672" class="label" font-weight="700">Lowest cognitive load</text>
  <text x="24" y="692" class="small">Best for new/occasional reporters &amp; onboarding (#620).</text>
</svg>
