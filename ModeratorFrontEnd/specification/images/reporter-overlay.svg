<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <style>
      .panel{fill:#fff;stroke:#c9d3dc;stroke-width:1.5}.navy{fill:#0c4968}.title{fill:#fff;font-size:15px;font-weight:700}.label{fill:#263847;font-size:13px}.small{fill:#607483;font-size:11px}.tiny{fill:#718493;font-size:10px}.chip{fill:#e8f4f8;stroke:#91bed0}.axis{stroke:#91a3b1;stroke-width:1}.grid{stroke:#30434f;stroke-width:.7;opacity:.55}
      .callout{fill:#fff3e0;stroke:#c25a2b;stroke-width:1.2}.calloutText{fill:#8a3c15;font-size:11px;font-weight:600}.leader{stroke:#c25a2b;stroke-width:1.2;stroke-dasharray:3 2;fill:none}.cdot{fill:#c25a2b}
      .ok{fill:#17864b;font-size:11px;font-weight:700}.hump{fill:#2f8f77}.trans{fill:#5b6bd6}.pend{fill:#b9c6cf}.sel{stroke:#087c8c;stroke-width:2.5;fill:none}
    </style>
    <linearGradient id="spec" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#09131c"/><stop offset=".55" stop-color="#152d39"/><stop offset="1" stop-color="#081018"/></linearGradient>
  </defs>
  <rect width="1120" height="540" fill="#eef3f6"/>
  <rect width="1120" height="44" class="navy"/>
  <text x="18" y="28" class="title" font-size="17">Reporter overlay · select &amp; group-tag open signals — confirmed = locked 🔒</text>

  <rect x="20" y="58" width="1080" height="462" rx="6" class="panel"/>
  <text x="34" y="86" class="small">View by species ▾ (read-only pivot)   ·   Orcasound Lab · 08:03–08:04</text>

  <!-- spectrogram -->
  <rect x="34" y="98" width="900" height="120" rx="3" fill="url(#spec)"/>
  <g class="grid"><line x1="34" y1="138" x2="934" y2="138"/><line x1="34" y1="178" x2="934" y2="178"/></g>
  <g opacity=".8"><rect x="120" y="120" width="14" height="92" rx="3" fill="#2f8f77"/><rect x="210" y="130" width="12" height="80" rx="3" fill="#2f8f77"/><rect x="470" y="116" width="12" height="98" rx="2" fill="#5b6bd6"/><rect x="560" y="132" width="12" height="78" rx="2" fill="#5b6bd6"/><rect x="650" y="124" width="12" height="88" rx="2" fill="#5b6bd6"/><rect x="820" y="150" width="12" height="58" rx="2" fill="#9fb3c0"/></g>

  <!-- signal chip lane -->
  <text x="34" y="262" class="label" font-weight="700">Signals (chips colored by species)</text>
  <rect x="34" y="276" width="900" height="46" rx="6" fill="#f5f8fa" stroke="#c9d3dc"/>
  <!-- confirmed locked chip -->
  <g><rect x="60" y="286" width="112" height="26" rx="13" fill="#e8f7f2" stroke="#17864b"/><circle cx="76" cy="299" r="6" class="hump"/><text x="88" y="303" class="small">humpback</text><text x="150" y="303" font-size="12">🔒</text></g>
  <!-- pending untagged chip -->
  <g><rect x="188" y="286" width="96" height="26" rx="13" fill="#fff" stroke="#b9c6cf" stroke-dasharray="4 3"/><circle cx="204" cy="299" r="6" class="pend"/><text x="216" y="303" class="small">untagged</text></g>
  <!-- selected group of pending transient chips -->
  <g><rect x="300" y="286" width="104" height="26" rx="13" fill="#eef0fb" stroke="#5b6bd6"/><circle cx="316" cy="299" r="6" class="trans"/><text x="328" y="303" class="small">transient?</text></g>
  <g><rect x="414" y="286" width="104" height="26" rx="13" fill="#eef0fb" stroke="#5b6bd6"/><circle cx="430" cy="299" r="6" class="trans"/><text x="442" y="303" class="small">transient?</text></g>
  <g><rect x="528" y="286" width="96" height="26" rx="13" fill="#fff" stroke="#b9c6cf" stroke-dasharray="4 3"/><circle cx="544" cy="299" r="6" class="pend"/><text x="556" y="303" class="small">untagged</text></g>
  <!-- rubber-band selection around a group -->
  <rect x="292" y="280" width="340" height="38" rx="8" class="sel" stroke-dasharray="6 4"/>

  <!-- group tag popover -->
  <rect x="360" y="340" width="250" height="120" rx="8" fill="#fff" stroke="#087c8c" stroke-width="1.5"/>
  <rect x="360" y="340" width="250" height="28" rx="8" fill="#087c8c"/>
  <text x="374" y="359" fill="#fff" font-size="12" font-weight="700">Tag 3 selected signals</text>
  <text x="374" y="390" class="small">Species</text>
  <rect x="374" y="398" width="222" height="26" rx="4" fill="#f1f5f7" stroke="#b9c6cf"/><text x="386" y="415" class="label">transient (Biggs) ▾</text>
  <rect x="374" y="430" width="108" height="22" rx="4" fill="#087c8c"/><text x="428" y="446" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">Apply</text>
  <rect x="490" y="430" width="106" height="22" rx="4" fill="#fff" stroke="#aebdc9"/><text x="543" y="446" class="small" text-anchor="middle">Cancel</text>

  <!-- callouts -->
  <path class="leader" d="M150 286 C150 250 170 240 200 240"/><circle cx="150" cy="286" r="3" class="cdot"/>
  <rect x="150" y="150" width="250" height="40" rx="5" class="callout"/>
  <text x="162" y="166" class="calloutText">Confirmed by a moderator → locked 🔒.</text>
  <text x="162" y="181" class="calloutText">Reporters &amp; models can’t re-tag it.</text>

  <path class="leader" d="M462 318 C462 330 470 340 470 340"/><circle cx="462" cy="318" r="3" class="cdot"/>
  <rect x="636" y="344" width="300" height="56" rx="5" class="callout"/>
  <text x="648" y="362" class="calloutText">Rubber-band / long-press to group-select many</text>
  <text x="648" y="377" class="calloutText">open signals, then apply one tag in a single action.</text>
  <text x="648" y="392" class="calloutText">Any locked members are skipped, not overwritten.</text>

  <rect x="636" y="410" width="300" height="66" rx="5" fill="#f5f8fa" stroke="#c9d3dc"/>
  <text x="648" y="430" class="small" font-weight="700">Reporter tag = proposal</text>
  <text x="648" y="449" class="tiny">Recorded as this reporter’s own signal (reporter_id),</text>
  <text x="648" y="463" class="tiny">state “proposed”. A moderator still confirms it before</text>
  <text x="648" y="477" class="tiny">it becomes authoritative (§6–§7).</text>

  <!-- legend -->
  <rect x="34" y="410" width="300" height="66" rx="5" fill="#f5f8fa" stroke="#c9d3dc"/>
  <text x="46" y="430" class="small" font-weight="700">Chip status</text>
  <circle cx="52" cy="449" r="6" class="hump"/><text x="66" y="453" class="small">confirmed 🔒</text>
  <rect x="150" y="443" width="14" height="12" rx="6" fill="#fff" stroke="#b9c6cf" stroke-dasharray="3 2"/><text x="170" y="453" class="small">untagged / pending</text>
  <circle cx="52" cy="468" r="6" class="trans"/><text x="66" y="472" class="small">proposed (yours or others)</text>
</svg>
