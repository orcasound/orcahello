<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <style>
      .panel{fill:#fff;stroke:#c9d3dc;stroke-width:1.5}.navy{fill:#0c4968}.title{fill:#fff;font-size:15px;font-weight:700}.label{fill:#263847;font-size:13px}.small{fill:#607483;font-size:11px}.tiny{fill:#718493;font-size:10px}.chip{fill:#e8f4f8;stroke:#91bed0}.axis{stroke:#91a3b1;stroke-width:1}.grid{stroke:#30434f;stroke-width:.7;opacity:.55}.button{fill:#087c8c}
      .callout{fill:#fff3e0;stroke:#c25a2b;stroke-width:1.2}.calloutText{fill:#8a3c15;font-size:11px;font-weight:600}.leader{stroke:#c25a2b;stroke-width:1.2;stroke-dasharray:3 2;fill:none}.cdot{fill:#c25a2b}
      .play{stroke:#61a9ff;stroke-width:2.5}.sel{stroke:#087c8c;stroke-width:2.5;fill:none}
    </style>
    <linearGradient id="spec" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#09131c"/><stop offset=".55" stop-color="#152d39"/><stop offset="1" stop-color="#081018"/></linearGradient>
    <pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#26424f"/><line x1="0" y1="0" x2="0" y2="6" stroke="#5c7d8c" stroke-width="2"/></pattern>
  </defs>
  <rect width="1200" height="560" fill="#eef3f6"/>
  <rect width="1200" height="44" class="navy"/>
  <text x="18" y="28" class="title" font-size="17">Timeline scrubber — how it looks &amp; functions</text>

  <rect x="20" y="58" width="1160" height="484" rx="6" class="panel"/>

  <!-- OVERVIEW RAIL -->
  <text x="34" y="86" class="small" font-weight="700">Overview · full session 07:00–09:00</text>
  <rect x="34" y="94" width="1000" height="40" rx="4" fill="#0c1c26"/>
  <g fill="#3f6b7d"><rect x="70" y="102" width="50" height="24"/><rect x="180" y="99" width="80" height="30"/><rect x="330" y="104" width="46" height="20"/><rect x="470" y="98" width="110" height="32"/><rect x="660" y="103" width="70" height="22"/><rect x="820" y="100" width="90" height="28"/></g>
  <!-- viewport window on the overview -->
  <rect x="452" y="90" width="96" height="48" rx="4" fill="#61a9ff" opacity=".22" stroke="#61a9ff" stroke-width="2"/>
  <rect x="450" y="90" width="6" height="48" rx="2" fill="#61a9ff"/><rect x="544" y="90" width="6" height="48" rx="2" fill="#61a9ff"/>
  <text x="1044" y="112" class="tiny">drag ↔ move</text><text x="1044" y="126" class="tiny">drag ▏▕ resize</text>

  <path class="leader" d="M500 138 C500 156 720 150 720 150"/><circle cx="500" cy="138" r="3" class="cdot"/>
  <rect x="600" y="146" width="440" height="22" rx="5" class="callout"/>
  <text x="612" y="161" class="calloutText">Drag the window (or its edges) to move/resize the visible span — no zoom loss</text>

  <!-- ZOOM CONTROL -->
  <g>
    <rect x="34" y="180" width="30" height="26" rx="4" fill="#fff" stroke="#aebdc9"/><text x="49" y="198" class="label" text-anchor="middle">−</text>
    <rect x="66" y="180" width="60" height="26" rx="4" class="button"/><text x="96" y="198" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">1 min</text>
    <rect x="128" y="180" width="30" height="26" rx="4" fill="#fff" stroke="#aebdc9"/><text x="143" y="198" class="label" text-anchor="middle">+</text>
    <text x="172" y="198" class="tiny">presets 10s · 1m · 15m · 1h</text>
    <text x="360" y="198" class="small">span = 1 min · zoom keeps the playhead centered</text>
  </g>

  <!-- MAIN DETAIL SPECTROGRAM (the window contents) -->
  <rect x="34" y="216" width="1000" height="150" rx="3" fill="url(#spec)"/>
  <g class="grid"><line x1="34" y1="261" x2="1034" y2="261"/><line x1="34" y1="306" x2="1034" y2="306"/></g>
  <!-- signal blocks: empty boxes around always-visible bursts -->
  <g opacity=".9" fill="#dcf1f8"><rect x="150" y="238" width="6" height="106" rx="2"/><rect x="160" y="256" width="4" height="80" rx="2" fill="#bfe6f4"/><rect x="326" y="246" width="6" height="90" rx="2"/><rect x="496" y="242" width="6" height="96" rx="2"/><rect x="586" y="248" width="6" height="82" rx="2"/><rect x="824" y="256" width="5" height="72" rx="2"/></g>
  <rect x="120" y="230" width="70" height="122" rx="4" fill="none" stroke="#39b98f" stroke-width="2.5"/><text x="128" y="246" fill="#bff0d3" font-size="12">✓</text>
  <rect x="300" y="238" width="60" height="106" rx="4" fill="none" stroke="#7f8ff0" stroke-width="2.5" stroke-dasharray="6 4"/><text x="306" y="254" fill="#fff" font-size="11">□</text>
  <rect x="470" y="234" width="60" height="112" rx="4" fill="none" stroke="#7f8ff0" stroke-width="2.5" stroke-dasharray="6 4"/><text x="476" y="250" fill="#fff" font-size="11">□</text>
  <rect x="560" y="240" width="60" height="104" rx="4" fill="none" stroke="#39b98f" stroke-width="2.5"/><text x="566" y="256" fill="#fff" font-size="11">×</text>
  <rect x="462" y="226" width="166" height="128" rx="8" class="sel" stroke-dasharray="6 4"/>
  <text x="468" y="222" fill="#61a9ff" font-size="11" font-weight="700">selection kept while scrubbing</text>
  <rect x="800" y="248" width="56" height="88" rx="4" fill="none" stroke="#d3a24a" stroke-width="2" stroke-dasharray="1 3"/><text x="806" y="264" fill="#fff" font-size="11">?</text>
  <g class="tiny" fill="#a9c4d1"><text x="34" y="360">08:03:00</text><text x="315" y="360">08:03:15</text><text x="596" y="360">08:03:30</text><text x="877" y="360">08:03:45</text><text x="1000" y="360">08:04:00</text></g>

  <!-- PLAYHEAD -->
  <line x1="690" y1="216" x2="690" y2="386" class="play"/>
  <rect x="654" y="196" width="74" height="20" rx="4" fill="#61a9ff"/><text x="691" y="211" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">08:03:34</text>

  <!-- SCRUB TRACK -->
  <rect x="34" y="378" width="1000" height="10" rx="5" fill="#dfe8ee"/>
  <rect x="34" y="378" width="656" height="10" rx="5" fill="#9cc6df"/>
  <circle cx="690" cy="383" r="11" fill="#fff" stroke="#61a9ff" stroke-width="3"/>
  <text x="1044" y="388" class="tiny">drag thumb to seek</text>

  <!-- callouts -->
  <path class="leader" d="M690 216 C690 200 760 188 760 188"/>
  <rect x="740" y="176" width="290" height="34" rx="5" class="callout"/>
  <text x="752" y="190" class="calloutText">Playhead seeks audio in sync — drag it, drag</text>
  <text x="752" y="203" class="calloutText">the thumb, tap the spectrogram, or ◀/▶ arrow keys.</text>

  <path class="leader" d="M155 352 C155 410 90 420 90 420"/><circle cx="155" cy="352" r="3" class="cdot"/>
  <rect x="34" y="410" width="470" height="120" rx="6" fill="#f5f8fa" stroke="#c9d3dc"/>
  <text x="46" y="432" class="label" font-weight="700">While scrubbing</text>
  <text x="46" y="454" class="small">• Zoom in/out changes the span (10 s ↔ 1 h); the playhead stays put.</text>
  <text x="46" y="474" class="small">• The current selection and its tag draft persist across scrub/zoom.</text>
  <text x="46" y="494" class="small">• Confirmed blocks stay authoritative ✓ — scrubbing never edits them.</text>
  <text x="46" y="514" class="small">• Audio around the playhead is prefetched for instant playback.</text>

  <rect x="524" y="410" width="510" height="120" rx="6" fill="#f5f8fa" stroke="#c9d3dc"/>
  <text x="536" y="432" class="label" font-weight="700">Selection → action</text>
  <text x="536" y="454" class="small">Select one/many blocks (drag marquee, shift-click, or “all in view”).</text>
  <circle cx="546" cy="474" r="12" class="button"/><path d="M542 467l10 7-10 7z" fill="#fff"/><text x="566" y="478" class="small">Listen (scoped/sequential)</text>
  <rect x="536" y="492" width="150" height="24" rx="4" fill="#fff" stroke="#b9c6cf"/><text x="548" y="508" class="small">Tag: transient ▾</text>
  <rect x="696" y="492" width="96" height="24" rx="4" fill="#17864b"/><text x="744" y="508" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">Approve all</text>
  <text x="800" y="508" class="tiny">→ authoritative ✓</text>
</svg>
