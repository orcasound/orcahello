---
name: InferenceSystem-deploy-configmaps

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: 'Hydrophone configuration to apply'
        required: true
        type: choice
        options:
          - andrews-bay
          - bush-point
          - mast-center
          - north-sjc
          - orcasound-lab
          - point-robinson
          - port-townsend
          - sunset-bay

permissions:  # added using https://github.com/step-security/secure-repo
  contents: read

jobs:
  deploy-configmaps:
    environment: inference-production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: inference-system-aks-deployment-${{ inputs.namespace }}
      cancel-in-progress: false
      queue: max
    env:
      NAMESPACE: ${{ inputs.namespace }}
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Require main branch
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "Run this workflow from main" >&2
            exit 1
          fi

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d  # v5.1.0

      - name: Set Kubernetes context
        uses: azure/k8s-set-context@8698eba2499e9012f0d5085f8798077cce4bc526  # v5.0.1
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Apply ConfigMap and restart deployment
        id: rollout
        run: bash .github/scripts/deploy-inference.sh

      - name: Show deployment diagnostics on failure
        if: failure() && steps.rollout.outcome == 'failure'
        run: |
          kubectl get deployment/inference-system -n "$NAMESPACE" -o wide || true
          kubectl get pods -n "$NAMESPACE" -l app=inference-system -o wide || true
          kubectl describe deployment/inference-system -n "$NAMESPACE" || true
