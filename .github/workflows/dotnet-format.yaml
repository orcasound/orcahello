---
name: dotnet format check

on:
  pull_request:
    branches:
      - main
    paths:
      - ModeratorFrontEnd/**
      - .editorconfig
      - .github/workflows/dotnet-format.yaml
  workflow_dispatch:  # Allow manual workflow invocation from the Github Actions UI

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - solution: ModeratorFrontEnd/AIForOrcas/AIForOrcas.slnx
            dotnet-version: 6.0.x
          - solution: ModeratorFrontEnd/OrcaHello/OrcaHello.slnx
            dotnet-version: 8.0.x
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up .NET Core
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          # .slnx solution files require the .NET SDK 9.0.200 or later, so install
          # a 9.0.x SDK in addition to the project's target-framework SDK.
          dotnet-version: |
            ${{ matrix.dotnet-version }}
            9.0.x
      - name: Format check
        run: dotnet format ${{ matrix.solution }} --verify-no-changes
