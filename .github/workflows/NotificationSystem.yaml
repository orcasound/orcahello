---
name: NotificationSystem

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual workflow invocation from the Github Actions UI

env:
  DOTNET_VERSION: 8.0.x
  DOTNET_RUNTIME: win-x86
  WORKING_DIR: NotificationSystem/NotificationSystem
  PUBLISH_DIR: output
  AZURE_APP_NAME: orcanotification

defaults:
  run:
    working-directory: NotificationSystem/NotificationSystem

permissions:  # added using https://github.com/step-security/secure-repo
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Check for file changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        with:
          filters: |
            src:
              - NotificationSystem/**
              - .github/workflows/NotificationSystem.yaml

  build-ubuntu:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.src == 'true' }}
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up .NET Core
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Dependencies
        run: dotnet restore -r ${{ env.DOTNET_RUNTIME }}
      - name: Build
        run: dotnet build --no-restore -c Release -r ${{ env.DOTNET_RUNTIME }} --self-contained
      - name: Unit Tests
        working-directory: NotificationSystem/NotificationSystem.Tests.Unit
        run: dotnet test
      - name: Publish
        run: dotnet publish --no-restore -c Release -o './${{ env.PUBLISH_DIR }}'
      - name: Artifacts cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ./${{ env.WORKING_DIR }}/${{ env.PUBLISH_DIR }}
          key: ${{ github.sha }}-${{ env.AZURE_APP_NAME }}-${{ env.DOTNET_RUNTIME }}-artifacts
  test-windows:
    runs-on: windows-latest
    needs: changes
    if: ${{ needs.changes.outputs.src == 'true' }}
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up .NET Core
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Dependencies
        run: dotnet restore -r ${{ env.DOTNET_RUNTIME }}
      - name: Build
        run: dotnet build --no-restore -c Release -r ${{ env.DOTNET_RUNTIME }} --self-contained
      - name: Unit Tests
        working-directory: NotificationSystem/NotificationSystem.Tests.Unit
        run: dotnet test
      - name: Integration Tests
        working-directory: NotificationSystem/NotificationSystem.Tests.Integration
        run: dotnet test
  deploy:
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    needs:
      - changes
      - build-ubuntu
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit
      - name: Artifacts cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ./${{ env.WORKING_DIR}}/${{ env.PUBLISH_DIR }}
          key: ${{ github.sha }}-${{ env.AZURE_APP_NAME }}-${{ env.DOTNET_RUNTIME }}-artifacts
      - name: Deploy to Azure Functions
        uses: azure/functions-action@c5060b3b8bb1ebbcb531abd00c822ecbaa8ea656  # v1.5.7
        with:
          app-name: ${{ env.AZURE_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          package: ./${{ env.WORKING_DIR }}/${{ env.PUBLISH_DIR }}
