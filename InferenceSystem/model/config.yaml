## V1 inference configuration (used by model_v1 audio + inference)
# Safe defaults preserve fastai parity; adjust thresholds/windowing as needed.
---
audio:
  downmix_mono: true
  resample_rate: 20000        # Hz
  normalize: true             # peak-normalize waveform to max(|x|)=1.0

spectrogram:
  sample_rate: 16000          # torchaudio default (fastai quirk)
  n_fft: 2560
  hop_length: 256
  mel_n_filters: 256
  mel_f_min: 0.0
  mel_f_max: 10000.0
  mel_f_pad: 0
  convert_to_db: true
  top_db: 100

model:
  name: "orcahello-srkw-detector-v1"
  input_pad_s: 4.0            # audio padded/trimmed to this duration
  num_classes: 2              # binary classification
  call_class_index: 1         # class index for positive (call detected)
  device: "auto"              # "auto" selects mps > cuda > cpu; or explicit "cpu"/"cuda"/"mps"
  precision: "auto"           # "auto" (float16 on cuda/mps, float32 on cpu), "float16", or "float32"

inference:
  window_s: 3.0               # segment length
  window_hop_s: 2.0           # hop between segments
  max_batch_size: 8           # max segments to process at once in detect_srkw_from_file
  strict_segments: true       # if false, allow partial final segment (true for fastai parity)

global_prediction:
  aggregation_strategy: "mean_top_k"  # aggregation method for global file-level prediction; mean_top_k | mean_thresholded
  mean_top_k: 2               # top segments to average for global_confidence
  pred_local_threshold: 0.5   # threshold for local binary per-segment predictions
  pred_global_threshold: 0.6  # applied to global_confidence for file-level prediction
