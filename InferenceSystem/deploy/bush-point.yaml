apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-system
  namespace: bush-point
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inference-system
  template:
    metadata:
      labels:
        app: inference-system
    spec:
      nodeSelector:
        kubernetes.azure.com/agentpool: f4sv2pool
      containers:
      - name: inference-system
        image: orcaconservancycr.azurecr.io/live-inference-system:12-01-2025.FastAI.R1-12.v0
        resources:
          requests:
            cpu: "1"
            memory: "1600Mi"
          limits:
            cpu: "1"
            memory: "2500Mi"
        env:
          - name: AZURE_COSMOSDB_PRIMARY_KEY
            valueFrom:
              secretKeyRef:
                name: inference-system
                key: AZURE_COSMOSDB_PRIMARY_KEY
          - name: AZURE_STORAGE_CONNECTION_STRING
            valueFrom:
              secretKeyRef:
                name: inference-system
                key: AZURE_STORAGE_CONNECTION_STRING
          - name: INFERENCESYSTEM_APPINSIGHTS_CONNECTION_STRING
            valueFrom:
              secretKeyRef:
                name: inference-system
                key: INFERENCESYSTEM_APPINSIGHTS_CONNECTION_STRING
          - name: OMP_NUM_THREADS
            value: "1"
          - name: MKL_NUM_THREADS
            value: "1"
        volumeMounts:
          - name: config-volume
            mountPath: /config
            readOnly: true
      volumes:
        - name: config-volume
          configMap:
            name: hydrophone-configs
